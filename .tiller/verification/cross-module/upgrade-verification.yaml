schema_version: 1
cases:
  - id: TC-VERIFY-UPGRADE
    title: 升级保留项目测试定义和规则
    modules: ["verification","initialization"]
    categories: ["compatibility","integration"]
    requirements: ["VERIFY-01","VERIFY-03"]
    given: ["0.3.5 工程已有测试配置、用例及项目测试规则"]
    when: ["分别升级当前工程与独立管理工程"]
    then: ["项目文件保留，新版规则可读且重复升级无改动"]
