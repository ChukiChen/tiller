schema_version: 1
cases:
  - id: TC-VERIFY-BOUNDARY
    title: 管理目录不能绕过业务仓库标识
    modules: ["verification"]
    categories: ["security","integration"]
    requirements: ["VERIFY-04","VERIFY-06"]
    given: ["独立管理登记业务仓库"]
    when: ["以大小写变体和容器路径配置管理套件"]
    then: ["拒绝绕过范围，显式业务标识可用"]
    automation:
      suite: catalog
      test_ref: "management suites cannot select repository container or nested repositories through cwd casing"
      source:
        repository: .
        path: test/verification-cases.test.mjs
